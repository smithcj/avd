name: lab1

mgmt:
  network: avd_mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    arista_ceos:
      image: ceos:4.36.2F

      env:
        CLAB_MGMT_VRF: MGMT


  nodes:
    spine1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.11

    spine2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.12

    leaf1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.21

    leaf2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.22

    leaf3:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.23

    leaf4:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.24
      
    host1:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.20.20.31
      exec:
        - ip link set eth1 up
        - ip address add 10.10.10.11/24 dev eth1
        - ip route del default via 172.20.20.1 dev eth0
        - ip route add default via 10.10.10.1 dev eth1

    host2:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.20.20.32
      exec:
        - ip link set eth1 up
        - ip address add 10.20.20.12/24 dev eth1
        - ip route del default via 172.20.20.1 dev eth0
        - ip route add default via 10.20.20.1 dev eth1

  links:
    # Leaf1 uplinks
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]

    # Leaf2 uplinks
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]

    # Leaf3 uplinks
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]

    # Leaf4 uplinks
    - endpoints: ["spine1:eth4", "leaf4:eth1"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]

    # MLAG leaf1/leaf2
    - endpoints: ["leaf1:eth3", "leaf2:eth3"]
    - endpoints: ["leaf1:eth4", "leaf2:eth4"]

    # MLAG leaf3/leaf4
    - endpoints: ["leaf3:eth3", "leaf4:eth3"]
    - endpoints: ["leaf3:eth4", "leaf4:eth4"]

    - endpoints: ["host1:eth1", "leaf1:eth5"]

    - endpoints: ["host2:eth1", "leaf3:eth5"]